
name: Build Projectivy Homestead

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;36.1.0"

      - name: Create temporary signing key
        run: |
          mkdir -p "$HOME/.homestead-keys"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.homestead-keys/homestead-release.keystore" \
            -storepass "temporary-build-password" \
            -keypass "temporary-build-password" \
            -alias homestead \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Homestead Build,O=Local,C=US"

      - name: Build APK
        env:
          HOMESTEAD_KEYSTORE: /home/runner/.homestead-keys/homestead-release.keystore
          HOMESTEAD_KEYPASS: temporary-build-password
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: projectivy-homestead-apk
          path: '**/*.apk'
          if-no-files-found: warn
